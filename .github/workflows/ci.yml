name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt coverage

      - name: Run flake8
        run: |
          cd backend
          flake8

      - name: Run pytest
        run: |
          cd backend
          pytest tests/ -v

      - name: Run coverage
        run: |
          cd backend
          coverage run -m pytest tests/
          coverage report --fail-under=80

      - name: Build Docker image
        run: |
          docker build backend -t promptlab-backend
